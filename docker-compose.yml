services:
  ps5-ffpfsc-pro:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ps5-ffpfsc-pro
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - PUID=1000
      - PGID=1000
    volumes:
      - ./config:/config
      - /mnt/localdata/Games:/games:ro
      - /mnt/localdata/PS5_Output:/output
      - /mnt/localdata/PS5_Temp:/temp
